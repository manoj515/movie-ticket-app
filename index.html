<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>🎬 MovieBook</h1>
    <p>Book your movie tickets</p>
</header>

<main class="container">

    <section class="movies">
        <h2>Now Showing</h2>

        <div class="movie-grid">

            <div class="movie-card">
                <div class="poster">🚀</div>
                <h3>Space Adventure</h3>
                <p>Action • 2h 15m</p>
                <p class="price">₹250</p>
                <button onclick="selectMovie('Space Adventure', 250)">
                    Book Ticket
                </button>
            </div>

            <div class="movie-card">
                <div class="poster">🦸</div>
                <h3>Super Hero</h3>
                <p>Action • 2h 05m</p>
                <p class="price">₹300</p>
                <button onclick="selectMovie('Super Hero', 300)">
                    Book Ticket
                </button>
            </div>

            <div class="movie-card">
                <div class="poster">😂</div>
                <h3>Funny Friends</h3>
                <p>Comedy • 1h 50m</p>
                <p class="price">₹200</p>
                <button onclick="selectMovie('Funny Friends', 200)">
                    Book Ticket
                </button>
            </div>

        </div>
    </section>

    <section class="booking">
        <h2>Book Your Ticket</h2>

        <label>Movie</label>
        <input id="movie" type="text" readonly>

        <label>Number of Tickets</label>
        <input id="tickets" type="number" min="1" value="1"
               onchange="calculateTotal()">

        <label>Show Time</label>
        <select id="show">
            <option>10:00 AM</option>
            <option>01:30 PM</option>
            <option>04:30 PM</option>
            <option>07:30 PM</option>
            <option>10:00 PM</option>
        </select>

        <h3>Total: ₹<span id="total">0</span></h3>

        <button class="confirm" onclick="confirmBooking()">
            Confirm Booking
        </button>

        <p id="message"></p>
    </section>

</main>

<footer>
    <p>MovieBook © 2026</p>
</footer>

<script src="script.js"></script>

</body>
</html>
